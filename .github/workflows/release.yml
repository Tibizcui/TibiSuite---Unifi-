name: Release to CurseForge

# Declencheurs :
# 1) push d'un tag "<Module>-v<version>" (ex: DailyTracker-v6.1) -> publie CE module.
# 2) declenchement manuel (onglet Actions -> Run workflow) avec dry_run=true
#    pour valider qu'un module se zippe correctement SANS rien pousser sur CurseForge.
#
# NB monorepo : BigWigsMods/packager exige un ".git" a la racine du dossier
# passe a "-t" (1 repo = 1 addon dans son usage normal). Ce repo contient 14
# addons dans un seul depot Git, donc chaque job copie d'abord le dossier du
# module dans un repertoire temporaire du runner et y cree un mini-checkout
# Git jetable (git init + commit + tag + remote "origin" pointant vers ce
# depot), uniquement pour satisfaire ces verifications. Rien n'est jamais
# pousse depuis ce mini-checkout. Le remote "origin" est necessaire : sans
# lui, le packager detecte l'upload CurseForge comme non disponible et
# saute l'envoi SANS AUCUNE erreur ni log (a decouvert lors du premier test
# reel du 2026-09-03 : le zip s'etait bien construit mais rien n'avait ete
# envoye sur CurseForge).
#
# NB variable d'environnement CurseForge : l'action "BigWigsMods/packager@v2"
# pointe vers un commit fige de release.sh qui ne lit QUE $CF_API_KEY (nom
# historique). Le README actuel sur la branche master documente $CF_API_TOKEN
# (nom plus recent), mais ce n'est PAS ce que le tag @v2 execute reellement :
# avec seulement CF_API_TOKEN defini, le script zippe tout correctement puis
# saute l'upload en silence total (aucune erreur, aucun log), car cf_token
# reste vide en interne. D'ou le nom "CF_API_KEY" utilise ci-dessous, alimente
# depuis le secret GitHub "CF_API_TOKEN" deja cree (pas besoin de dupliquer le
# secret, juste de le mapper vers le bon nom de variable).
#
# NB anti-spam CurseForge (incident du 2026-09, resolu) : l'incident initial
# (3 projets bloques "Changes Required : merge your uploads into a single
# project, or space them out.") venait d'un upload manuel en double du zip en
# plus du push de tag, pas d'une simultaneite entre projets CurseForge -- voir
# commit "CI CurseForge : serialise les publications + delai minimal d'1h".
# Ce garde-fou (concurrency + attente d'1h entre publications) a ete retire
# une fois le souci reel regle cote CurseForge : les tags peuvent de nouveau
# etre pousses en meme temps ou a la suite, chaque module publie des que son
# job est pret, sans file d'attente ni delai artificiel.
on:
  push:
    tags:
      - '*-v*'
  workflow_dispatch:
    inputs:
      module:
        description: 'Nom du dossier addon a tester (ex: DailyTracker)'
        required: true
      dry_run:
        description: 'Dry run (ne pousse rien sur CurseForge)'
        type: boolean
        default: true
      version:
        description: 'Version a utiliser comme nom de fichier (ex: v7.1.0) - laisser vide pour un test dev-horodate'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - DailyTracker
          - DgnTracker
          - LairLens
          - LegTracker
          - LvlHistory
          - MiniHub
          - PostBox
          - RenTracker
          - RepBar
          - SkillTracker
          - Stats
          - WeeklyCompass
          - XPBar
          - TibiSuite
    # NB: le contexte "matrix" n'est disponible que dans les steps, pas dans
    # le "if" du job lui-meme -> le filtrage par module se fait step par step.
    steps:
      - uses: actions/checkout@v4

      - name: Determine si ce job publie ${{ matrix.module }}
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${GITHUB_REF#refs/tags/}" == "${{ matrix.module }}-v"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF#refs/tags/${{ matrix.module }}-}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.module }}" = "${{ matrix.module }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            if [ -n "${{ github.event.inputs.version }}" ]; then
              echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            else
              echo "version=dev-$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Construit un mini-checkout Git isole pour ${{ matrix.module }}
        if: steps.gate.outputs.run == 'true'
        run: |
          pkgdir="${{ runner.temp }}/pkg-${{ matrix.module }}"
          rm -rf "$pkgdir"
          mkdir -p "$pkgdir"
          cp -r "${{ matrix.module }}/." "$pkgdir/"
          cd "$pkgdir"
          git init -q
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git config user.email "ci@tibiscui.local"
          git config user.name "TibiSuite CI"
          git add -A
          git commit -q -m "release ${{ steps.gate.outputs.version }}"
          git tag "${{ steps.gate.outputs.version }}"

      - name: Package ${{ matrix.module }} (dry run, aucun envoi)
        if: |
          steps.gate.outputs.run == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.dry_run == 'true'
        uses: BigWigsMods/packager@v2
        with:
          args: -d -t ${{ runner.temp }}/pkg-${{ matrix.module }}

      - name: Package et publie ${{ matrix.module }} sur CurseForge
        if: |
          steps.gate.outputs.run == 'true' &&
          (github.event_name == 'push' || github.event.inputs.dry_run != 'true')
        uses: BigWigsMods/packager@v2
        with:
          args: -t ${{ runner.temp }}/pkg-${{ matrix.module }}
        env:
          CF_API_KEY: ${{ secrets.CF_API_TOKEN }}
