name: Release to CurseForge

# Declencheurs :
# 1) push d'un tag "<Module>-v<version>" (ex: DailyTracker-v6.1) -> publie CE module.
# 2) declenchement manuel (onglet Actions -> Run workflow) avec dry_run=true
#    pour valider qu'un module se zippe correctement SANS rien pousser sur CurseForge.
#
# NB monorepo : BigWigsMods/packager exige un ".git" a la racine du dossier
# passe a "-t" (1 repo = 1 addon dans son usage normal). Ce repo contient 14
# addons dans un seul depot Git, donc chaque job copie d'abord le dossier du
# module dans un repertoire temporaire du runner et y cree un mini-checkout
# Git jetable (git init + commit + tag + remote "origin" pointant vers ce
# depot), uniquement pour satisfaire ces verifications. Rien n'est jamais
# pousse depuis ce mini-checkout. Le remote "origin" est necessaire : sans
# lui, le packager detecte l'upload CurseForge comme non disponible et
# saute l'envoi SANS AUCUNE erreur ni log (a decouvert lors du premier test
# reel du 2026-09-03 : le zip s'etait bien construit mais rien n'avait ete
# envoye sur CurseForge).
on:
  push:
    tags:
      - '*-v*'
  workflow_dispatch:
    inputs:
      module:
        description: 'Nom du dossier addon a tester (ex: DailyTracker)'
        required: true
      dry_run:
        description: 'Dry run (ne pousse rien sur CurseForge)'
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - DailyTracker
          - DgnTracker
          - LairLens
          - LegTracker
          - LvlHistory
          - MiniHub
          - PostBox
          - RenTracker
          - RepBar
          - SkillTracker
          - Stats
          - WeeklyCompass
          - XPBar
          - TibiSuite
    # NB: le contexte "matrix" n'est disponible que dans les steps, pas dans
    # le "if" du job lui-meme -> le filtrage par module se fait step par step.
    steps:
      - uses: actions/checkout@v4

      - name: Determine si ce job publie ${{ matrix.module }}
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${GITHUB_REF#refs/tags/}" == "${{ matrix.module }}-v"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF#refs/tags/${{ matrix.module }}-}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.module }}" = "${{ matrix.module }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "version=dev-$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Construit un mini-checkout Git isole pour ${{ matrix.module }}
        if: steps.gate.outputs.run == 'true'
        run: |
          pkgdir="${{ runner.temp }}/pkg-${{ matrix.module }}"
          rm -rf "$pkgdir"
          mkdir -p "$pkgdir"
          cp -r "${{ matrix.module }}/." "$pkgdir/"
          cd "$pkgdir"
          git init -q
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git config user.email "ci@tibiscui.local"
          git config user.name "TibiSuite CI"
          git add -A
          git commit -q -m "release ${{ steps.gate.outputs.version }}"
          git tag "${{ steps.gate.outputs.version }}"

      - name: Package ${{ matrix.module }} (dry run, aucun envoi)
        if: |
          steps.gate.outputs.run == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.dry_run == 'true'
        uses: BigWigsMods/packager@v2
        with:
          args: -d -t ${{ runner.temp }}/pkg-${{ matrix.module }}

      # DEBUG TEMPORAIRE (a retirer une fois le probleme trouve) : les 3 tests
      # reels precedents (v6.0, v6.0.1, v6.0.2) construisent le zip avec succes
      # mais n'appellent jamais l'upload CurseForge, sans la moindre ligne de
      # log ("Uploading..." absent, "Skipping upload to CurseForge." absent,
      # "jq not found" absent) alors que le zip existe bien sur le disque a cet
      # instant (verifie). Donc la garde interne du script
      #   if [[ -z $skip_upload && -n $archive && -s $archive ]]; then
      # est fausse pour une raison qui echappe a la lecture statique du script.
      # On execute ici release.sh directement sous "bash -x" (au lieu de
      # passer par l'action BigWigsMods/packager@v2) pour voir la substitution
      # reelle de $skip_upload/$archive au moment du test.
      - name: "[DEBUG] Trace complete de release.sh pour ${{ matrix.module }}"
        if: |
          steps.gate.outputs.run == 'true' &&
          (github.event_name == 'push' || github.event.inputs.dry_run != 'true')
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          pkgdir="${{ runner.temp }}/pkg-${{ matrix.module }}"
          curl -sL https://raw.githubusercontent.com/BigWigsMods/packager/master/release.sh -o "${{ runner.temp }}/release.sh"
          set +e
          bash -x "${{ runner.temp }}/release.sh" -t "$pkgdir" \
            > "${{ runner.temp }}/out.log" 2> "${{ runner.temp }}/trace.log"
          echo "exit code: $?"
          set -e
          echo "::group::stdout complet"
          cat "${{ runner.temp }}/out.log"
          echo "::endgroup::"
          echo "::group::trace autour de skip_upload / archive"
          grep -n "skip_upload\|^+ \[\[ -z\|^+ archive=\|command -v jq\|upload_curseforge" "${{ runner.temp }}/trace.log" || echo "(rien trouve)"
          echo "::endgroup::"
          echo "::group::200 dernieres lignes de la trace complete"
          tail -200 "${{ runner.temp }}/trace.log"
          echo "::endgroup::"
